const SEMITONES = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };

function freq(note) {
  const match = /^([A-G]#?)(-?\d)$/.exec(note);
  if (!match) return 440;
  const midi = 60 + SEMITONES[match[1]] + (Number(match[2]) - 4) * 12;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function makeReverb(context) {
  const length = Math.floor(context.sampleRate * 1.8);
  const impulse = context.createBuffer(2, length, context.sampleRate);
  for (let channel = 0; channel < 2; channel += 1) {
    const data = impulse.getChannelData(channel);
    for (let i = 0; i < length; i += 1) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 3) * 0.32;
    }
  }
  const convolver = context.createConvolver();
  convolver.buffer = impulse;
  return convolver;
}

function schedule(track, context, master, reverb) {
  const beat = 60 / 60;
  const bar = beat * 4;
  const at = (seconds) => seconds;

  const tone = (time, opts) => {
    const {
      frequency, type = 'sine', gain = 0.05, attack = 0.01, decay = 0.6,
      filterFrequency = null, vibrato = false,
    } = opts;
    const osc = context.createOscillator();
    osc.type = type;
    osc.frequency.value = frequency;
    const amp = context.createGain();
    amp.gain.setValueAtTime(0.0001, time);
    amp.gain.exponentialRampToValueAtTime(gain, time + attack);
    amp.gain.exponentialRampToValueAtTime(0.0001, time + attack + decay);
    let node = osc;
    if (filterFrequency) {
      const filter = context.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = filterFrequency;
      node.connect(filter);
      node = filter;
    }
    if (vibrato) {
      const lfo = context.createOscillator();
      lfo.frequency.value = 5.1;
      const lfoGain = context.createGain();
      lfoGain.gain.value = frequency * 0.006;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);
      lfo.start(time);
      lfo.stop(time + attack + decay + 0.05);
    }
    node.connect(amp);
    amp.connect(master);
    amp.connect(reverb);
    osc.start(time);
    osc.stop(time + attack + decay + 0.05);
  };

  for (let barIndex = 0; barIndex < 8; barIndex += 1) {
    const start = barIndex * bar;
    const chord = track.chords[barIndex % track.chords.length];

    chord.forEach((note, index) => {
      const osc = context.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq(note) * (index === 0 ? 0.5 : 1);
      const amp = context.createGain();
      amp.gain.setValueAtTime(0.0001, start);
      amp.gain.exponentialRampToValueAtTime(track.padGain, start + 0.9);
      amp.gain.setValueAtTime(track.padGain, start + bar - 0.6);
      amp.gain.exponentialRampToValueAtTime(0.0001, start + bar);
      osc.connect(amp);
      amp.connect(master);
      amp.connect(reverb);
      osc.start(start);
      osc.stop(start + bar + 0.05);
    });

    [0, 2].forEach((offset) => {
      tone(start + offset * beat, {
        frequency: freq(chord[0]) / 2,
        type: 'triangle',
        gain: track.bassGain,
        attack: 0.01,
        decay: beat * 1.5,
        filterFrequency: 300,
      });
    });

    track.arpPattern.forEach((index, step) => {
      const note = chord[index % chord.length];
      const octave = step % 4 === 3 ? 2 : 1;
      tone(start + step * (beat / 2), {
        frequency: freq(note) * octave * track.arpOctave,
        type: 'triangle',
        gain: track.arpGain,
        attack: 0.005,
        decay: beat * 0.45,
        filterFrequency: 2400,
      });
    });
  }

  track.melody.forEach(([note, startBeat, durationBeats]) => {
    tone(startBeat * beat, {
      frequency: freq(note),
      type: track.leadType,
      gain: track.leadGain,
      attack: track.leadAttack,
      decay: Math.min(durationBeats * beat * 0.95, track.leadDecay),
      filterFrequency: track.leadFilter,
      vibrato: track.vibrato,
    });
  });
}

function encodeWav(buffer) {
  const channels = buffer.numberOfChannels;
  const frames = buffer.length;
  const blockAlign = channels * 2;
  const dataSize = frames * blockAlign;
  const view = new DataView(new ArrayBuffer(44 + dataSize));
  const writeString = (offset, value) => { for (let i = 0; i < value.length; i += 1) view.setUint8(offset + i, value.charCodeAt(i)); };
  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, channels, true);
  view.setUint32(24, buffer.sampleRate, true);
  view.setUint32(28, buffer.sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, dataSize, true);
  const data = [];
  for (let c = 0; c < channels; c += 1) data.push(buffer.getChannelData(c));
  let offset = 44;
  for (let f = 0; f < frames; f += 1) {
    for (let c = 0; c < channels; c += 1) {
      const sample = Math.max(-1, Math.min(1, data[c][f]));
      view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
      offset += 2;
    }
  }
  const bytes = new Uint8Array(view.buffer);
  let binary = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  return btoa(binary);
}

window.renderTrack = async function renderTrack(id) {
  const track = TRACKS[id];
  if (!track) throw new Error(`Unknown track: ${id}`);
  const offline = new OfflineAudioContext(2, Math.ceil(SR * DURATION), SR);
  const master = offline.createGain();
  master.gain.setValueAtTime(0.0001, 0);
  master.gain.exponentialRampToValueAtTime(0.85, 0.9);
  master.gain.setValueAtTime(0.85, DURATION - 1.4);
  master.gain.exponentialRampToValueAtTime(0.0001, DURATION);
  master.connect(offline.destination);

  const reverb = makeReverb(offline);
  const wet = offline.createGain();
  const wetLevel = track.reverb ?? 0.22;
  wet.gain.setValueAtTime(0.0001, 0);
  wet.gain.exponentialRampToValueAtTime(wetLevel, 0.9);
  wet.gain.setValueAtTime(wetLevel, DURATION - 1.4);
  wet.gain.exponentialRampToValueAtTime(0.0001, DURATION);
  reverb.connect(wet);
  wet.connect(offline.destination);

  schedule(track, offline, master, reverb);
  const buffer = await offline.startRendering();
  return encodeWav(buffer);
};
